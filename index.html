<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="blue" />
    <meta name="author" content="Brishank Singh" />
    <link rel="icon" type="image/png" href="bslogo.png" />
    <meta name="description" content="A.I. Chat by Brishank" />
    <meta property="og:title" content="Gemini by Brishank" />
    <meta
      property="og:image"
      content="https://brishanksingh7843-design.github.io/Loading/naturelogo.png"
    />
    <title>Gemini</title>
    <style>
      body {
        width: 100%;
        height: 100vh;
        overflow-x: hidden;
        display: grid;
        place-items: center;
        place-content: center;
      }
      .starting {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background: linear-gradient(rgb(255, 0, 0), blue);
        background-size: 100% 300%;
        animation:first 10s linear 0s infinite,showup 8100ms linear 0s 1;
        z-index: -5;
      }
      @keyframes first {
        from {
          background-position: 0% 0%;
        }
        50% {
          background-position: 100% 100%;
        }
        100% {
          background-position: 0% 0%;
        }
      }
      @keyframes showup {
        from {
          z-index: 5;
        }
      }
      .starting2,
      .starting3 {
        position: absolute;
        z-index: 2;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background: linear-gradient(
          to bottom right,
          transparent 49%,
          white 50% 50%,
          transparent 51%
        );
        background-size: 200% 200%;
        animation: start 10s linear infinite;
        z-index: -4;
      }
      .starting3 {
        background: linear-gradient(
          to bottom left,
          transparent 49%,
          white 50% 50%,
          transparent 51%
        );
        background-size: 200% 200%;
        animation: start2 8s linear infinite;
        z-index: -4;
      }
      .starting-image {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        place-content: center;
        display: inline-block;
        background: blue;
        animation: image 4000ms linear 0s 1;
        opacity: 0;
        z-index: 100;
      }

      /*
      .my-element {
       name | duration | timing-function | delay | iteration-count
       animation: move-it 2s ease-in-out 0s 1;
      }*/

      @keyframes image {
        0% {
          opacity: 1;
          transform: scale(2.5);
        }
        30% {
          transform: scale(1);
        }
        70% {
          transform: scale(1);
        }
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: scale(2.5);
          display: none;
        }
      }

      @keyframes start2 {
        0% {
          background-position: 0% 100%;
        }
        50% {
          background-position: 100% 0%;
        }
        100% {
          background-position: 0% 100%;
        }
      }

      @keyframes start {
        0% {
          background-position: 100% 100%;
        }
        50% {
          background-position: 0% 0%;
        }
        100% {
          background-position: 100% 100%;
        }
      }
      /*
      vw=viewport width, vh=viewport height*/
      .space {
        height: 80vh;
        width: 90vw;
        background: rgba(0, 0, 0, 0.75);
        border-radius: 30px;
        display: inline-block;
        position: relative;
        padding: 20px;
      }
      .sending {
        position: absolute;
        bottom: 15px;
        left: 15px;
        right: 15px;
        height: 6vh;
        display: flex;
        flex-direction: row;
        align-items: flex-end;
      }
      .typingarea {
        background: grey;
        box-sizing: border-box;
        border-radius: 30px;
        color: black;
        padding: 10px;
        padding-left: 20px;
        white-space: pre-wrap; /*this is important */
        overflow-y: hidden;
        outline: none;
        border: 1px solid black;
        min-height: 6vh;
        flex: 1;
        font-size: 1.5rem;
      }
      .appear-text {
        display: block;
        margin-bottom: 50px;
        padding: 10px;
      }
      .youralign {
        display: flex;
        justify-content: end;
        overflow-x: hidden;
      }
      .airesponse {
        display: inline-block;
        color: white;
        font-weight: bold;
        font-size: 1.5rem;
        text-align: left;
        line-height: 2rem;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .yourquery {
        color: lightgrey;
        font-size: 1;
        max-width: 200px;
        text-wrap: wrap;
        margin-bottom: 10px;
        background: blue;
        padding: 20px;
        border-radius: 15px;
        display: inline-block;
        word-wrap: break-word;
      }
      .talk-data {
        height: 65vh;
        overflow-y: auto;
        scroll-behavior: smooth;
      }
      .talk-data::-webkit-scrollbar {
        width: 0.6vw;
      }
      .talk-data::-webkit-scrollbar-track {
        background: transparent;
      }
      .talk-data::-webkit-scrollbar-thumb {
        background: lightgrey;
        border-radius: 30px;
      }
      .talk-data::-webkit-scrollbar-thumb:hover {
        background: grey;
      }
      h1 {
        color: cyan;
        text-align: center;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body onkeydown="check(window.event)">
    <div class="starting">
      <div class="starting2"></div>
      <img class="starting-image" src="wholescreen.png" />
      <div class="starting3"></div>
    </div>
    <div class="space">
      <h1>Chat Bot</h1>
      <div class="talk-data"></div>
      <div class="sending">
        <div
          class="typingarea"
          id="typ"
          contenteditable="true"
          role="textbox"
          aria-multiline="true"
          data-placeholder="Message Gemini..."
        ></div>
      </div>
    </div>
    <script>
      let html = "";
      let your = "";

      function check(e) {
        // console.log(e.key);
        if (e.key === "Enter") {
          your = document.querySelector(".typingarea").innerText;
          document.querySelector(".typingarea").innerText = "";
          feh();
          console.log("check correct");
        }
      }

      async function feh() {
        try {
          const response = await fetch("http://localhost:3000/ok", {
            method: "POST",
            headers: {
              "Content-Type": "application/json", //tells server to expect SON
            },
            body: JSON.stringify({
              message: `${your}`,
            }),
          });
          console.log(response);
          const data = await response.text();
          // console.log(data);
          let each = `
              <div class="appear-text">
                <div class="youralign">
                  <div class="yourquery">
                  ${your}
                  </div>
                </div>

                <div class="airesponse">
                  ${data}
                </div>
              </div>`;
          // console.log(each);
          html += each;
          document.querySelector(".talk-data").innerHTML = html;
          const scrollContainer = document.querySelector(".talk-data");
          scrollContainer.scrollTo({
            top: scrollContainer.scrollHeight,
            behavior: "smooth",
          });
        } catch (error) {
          console.log("failed to load");
        }
      }
    </script>
  </body>
</html>
